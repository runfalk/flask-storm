name: CI
on: [push, pull_request]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Set up uv and Python
        uses: astral-sh/setup-uv@v10.3.2
        with:
          python-version: "3.15"
      - name: Install dependencies
        run: uv sync --locked
      - name: Check codestyle
        run: uv run --no-sync ruff format --check flask_storm/ tests/
      - name: Run linting
        run: uv run --no-sync ruff check flask_storm/ tests/

  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14", "3.15"]
    name: Python ${{ matrix.python-version }}
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Set up uv and Python ${{ matrix.python-version }}
        uses: astral-sh/setup-uv@v10.3.2
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: uv sync --locked --extra fancy
      - name: Run test suite
        run: uv run --no-sync pytest

  publish:
    runs-on: ubuntu-latest
    needs: [lint, build]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags')
    name: Publish
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Set up uv and Python
        uses: astral-sh/setup-uv@v10.3.2
        with:
          python-version: "3.15"
      - name: Build distributions
        run: uv build
      - name: Publish dist/
        uses: pypa/gh-action-pypi-publish@v1.14.3
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
