name: GH Pages

on:
  push:
    branches:
      - master

jobs:
  docs-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    name: Deploy docs
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Set up uv and Python
        uses: astral-sh/setup-uv@v10.3.2
        with:
          python-version: "3.15"
      - name: Install dependencies
        run: uv sync --locked
      - name: Build documentation
        run: |
          uv run --no-sync sphinx-build doc/ doc-build/
          touch doc-build/.nojekyll
      - name: Deploy
        uses: crazy-max/ghaction-github-pages@v5.0.0
        with:
          allow_empty_commit: false
          build_dir: doc-build/
          committer: Andreas Runfalk <andreas@runfalk.se>
          keep_history: true
          jekyll: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
