[project]
name = "Flask-Storm"
version = "2.0.0"
description = "Storm integration for Flask."
readme = "README.rst"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Andreas Runfalk", email = "andreas@runfalk.se" }]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Framework :: Flask",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Topic :: Database",
    "Topic :: Utilities",
    "Topic :: Software Development :: Libraries",
]
dependencies = [
    "Flask>=2.2",
    "storm>=0.21",
]

[build-system]
requires = ["uv_build>=0.13.5,<0.14"]
build-backend = "uv_build"

[project.urls]
Homepage = "https://github.com/runfalk/flask-storm"
Documentation = "https://runfalk.github.io/flask-storm"

[project.optional-dependencies]
fancy = ["sqlparse>=0.2.2"]

[dependency-groups]
dev = [
    "mock",
    "pytest>=3",
    "pytest-cov",
    "pytest-helpers-namespace",
    "ruff",
    "sphinx",
]

[tool.uv.build-backend]
module-root = ""
source-include = ["doc/**", "tests/**", "example.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 88
